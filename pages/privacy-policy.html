<!DOCTYPE html>
<html lang="en">

<head>

  <!-- ==========================================
       META
  =========================================== -->

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    http-equiv="X-UA-Compatible"
    content="IE=edge"
  />

  <!-- ==========================================
       SEO
  =========================================== -->

  <title>
    Privacy Policy | banshiwale
  </title>

  <meta
    name="description"
    content="Read banshiwale's Privacy Policy to understand how we collect, use, and protect your personal information while providing a secure shopping experience."
  />

  <meta
    name="keywords"
    content="banshiwale Privacy Policy, Privacy Policy, Sterling Silver Jewellery, Men's Jewellery"
  />

  <meta
    name="author"
    content="banshiwale"
  />

  <meta
    name="robots"
    content="index, follow"
  />

  <!-- ==========================================
       OPEN GRAPH
  =========================================== -->

  <meta
    property="og:title"
    content="Privacy Policy | banshiwale"
  />

  <meta
    property="og:description"
    content="Learn how banshiwale collects, stores, and protects your personal information."
  />

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:image"
    content="../src/assets/images/og-image.jpg"
  />

  <meta
    property="og:url"
    content="https://www.banshiwale.com/privacy-policy"
  />

  <!-- ==========================================
       THEME
  =========================================== -->

  <meta
    name="theme-color"
    content="#181818"
  />

  <!-- ==========================================
       FAVICON
  =========================================== -->

  <link
    rel="icon"
    href="../favicon.ico"
    sizes="any"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="96x96"
    href="../favicon-96x96.png"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="../favicon-512x512.png"
  />

  <link
    rel="apple-touch-icon"
    href="../apple-touch-icon.png"
  />

  <!-- ==========================================
       GOOGLE FONTS
  =========================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- ==========================================
       TAILWIND
  =========================================== -->

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ==========================================
       CSS
  =========================================== -->

  <link
    rel="stylesheet"
    href="../src/css/main.css"
  />



</head>

<body
  data-policy="Privacy Policy"
  class="
    bg-white
    text-[#181818]
    antialiased
  "
>

  <!-- ==========================================
       NAVBAR
  =========================================== -->

  <div
    id="navbar-container"
    data-theme="dark"
    data-announcement="false"
  ></div>


<!-- ==========================================
     HERO
=========================================== -->

<section
  class="
    border-b
    border-[#ECE7E1]
    bg-[#FAF8F5]
    py-14
  "
>

  <div
    class="
      mx-auto
      max-w-5xl
      px-6
      py-28
      text-center
    "
  >

    <h1
      id="policyTitle"
      class="
        font-serif
        text-5xl
        leading-tight
        text-[#181818]
        md:text-6xl
      "
    >
      Privacy Policy
    </h1>


    <p
      id="policyDescription"
      class="
        mx-auto
        mt-8
        max-w-2xl
        text-lg
        leading-8
        text-[#6B6B6B]
      "
    >
      We value your privacy and are committed to protecting your
      personal information. This Privacy Policy explains how
      banshiwale collects, uses, stores, and safeguards your data
      when you browse or shop on our website.
    </p>


    <p
      id="policyLastUpdated"
      class="
        mt-8
        text-sm
        text-[#8A8A8A]
      "
    >
      Last Updated: July 2026
    </p>

  </div>

</section>

  <!-- DYNAMIC PRIVACY CONTENT -->

  <section class="bg-white">

    <div
      id="policyContent"
      class="
        mx-auto
        max-w-4xl
        space-y-16
        px-6
        py-14
      "
    >

      <p class="text-[#777777]">
        Loading...
      </p>

    </div>

  </section>


  <footer id="footer"></footer>

  <script
    type="module"
    src="../src/main.js"
  ></script>

</body>

</html>
