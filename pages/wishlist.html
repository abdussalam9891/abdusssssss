<!DOCTYPE html>
<html lang="en">

<head>

  <script>
    if (location.hostname === 'www.banshiwale.com') {
      location.replace('https://banshiwale.com' + location.pathname + location.search + location.hash);
    }
  </script>

  <!-- Meta -->

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Banshiwale | Wishlist</title>

  <meta
    name="description"
    content="The jewellery pieces you've saved from banshiwale."
  />

  <meta
    name="robots"
    content="noindex, follow"
  />

  <meta
    name="theme-color"
    content="#181818"
  />

  <!-- Favicon -->

  <link
    rel="icon"
    href="../favicon.ico"
    sizes="any"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="96x96"
    href="../favicon-96x96.png"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="../favicon-512x512.png"
  />

  <link
    rel="apple-touch-icon"
    href="../apple-touch-icon.png"
  />

  <!-- Fonts -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    rel="preload"

    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
  />

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"

    onload="this.media='all'; this.onload=null;"
  />

  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" /></noscript>

  <link
    rel="stylesheet"
    href="../src/css/main.css"
  />

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#A07936",
            background: "#181818",
            surface: "#1C1C1C",
          },

          fontFamily: {
            sans: ["Inter", "sans-serif"],
            serif: ["Cormorant Garamond", "serif"],
          },
        },
      },
    };
  </script>

</head>

<body
  class="
    min-h-screen
    bg-white
    font-sans
    text-[#181818]
    antialiased

>

  <!-- Navbar -->

  <div
    id="navbar-container"
    data-theme="dark"
    data-announcement="false"
  ></div>

  <!-- Main -->

  <main>
    <section id="wishlistPage"></section>
  </main>

  <!-- Footer -->

  <div id="footer"></div>

  <script
    src="https://unpkg.com/lucide@1.40.0"
    defer
  ></script>

  <script
    type="module"
    src="../src/main.js"
  ></script>

</html>
