<!DOCTYPE html>
<html lang="en">

<head>

  <!-- ==========================================
       META
  =========================================== -->

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    http-equiv="X-UA-Compatible"
    content="IE=edge"
  />

  <!-- ==========================================
       SEO
  =========================================== -->

  <title>
    Refund Policy | banshiwale
  </title>

  <meta
    name="description"
    content="Read banshiwale's Refund Policy to understand our return, exchange, cancellation, and refund process for your purchases."

  <meta

    content="banshiwale"
  />

  <meta
    name="robots"

  />

  =========================================== -->

  <meta
    property="og:title"
    content="Refund Policy | banshiwale"
  />

  <meta
    property="og:description"
    content="Learn about banshiwale's return, exchange, and refund policy."
  />

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:image"
    content="../src/assets/images/og-image.jpg"
  />

  <meta
    property="og:url"
    content="https://www.banshiwale.com/refund-policy"
  />

  <!-- ==========================================
       THEME
  =========================================== -->

  <meta
    name="theme-color"
    content="#181818"
  />

  <!-- ==========================================
       FAVICON
  =========================================== -->

  <link
    rel="icon"
    href="/favicon.ico"
  />

  <!-- ==========================================
       GOOGLE FONTS
  =========================================== -->

  <link

    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap"

  />

       TAILWIND
  =========================================== -->

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ==========================================
       CSS
  =========================================== -->

  <link
    rel="stylesheet"
    href="../src/css/main.css"
  />

<body
  data-policy="Return & Refund Policy"
  class="
    bg-white
    text-[#181818]
    antialiased
  "
>

  <!-- ==========================================
       NAVBAR
  =========================================== -->

  <div
    id="navbar-container"
    data-theme="dark"
    data-announcement="true"
  ></div>


  <!-- ==========================================
       HERO
  =========================================== -->

  <section
    class="
      border-b
      border-[#ECE7E1]
      py-14
      bg-[#FAF8F5]
    "
  >

    <div
      class="
        mx-auto
        max-w-5xl
        px-6
        py-28
        text-center
      "
    >

      <h1
        id="policyTitle"
        class="
          font-serif
          text-5xl
          leading-tight
          text-[#181818]
          md:text-6xl
        "
      >
        Refund Policy
      </h1>


      <p
        id="policyDescription"
        class="
          mx-auto
          mt-8
          max-w-2xl
          text-lg
          leading-8
          text-[#6B6B6B]
        "
      >
        We want you to shop with confidence. This Refund Policy
        explains the conditions for returns, exchanges, cancellations,
        and refunds for purchases made through banshiwale.
      </p>


      <p
        id="policyLastUpdated"
        class="
          mt-8
          text-sm
          text-[#8A8A8A]
        "
      >
        Last Updated: July 2026
      </p>

    </div>

  </section>


  <!-- ==========================================
       DYNAMIC REFUND POLICY CONTENT
  =========================================== -->

  <section class="bg-white">

    <div
      id="policyContent"
      class="
        mx-auto
        max-w-4xl
        space-y-16
        px-6
        py-14
      "
    >

      <p class="text-[#777777]">
        Loading...
      </p>

    </div>

  </section>


  <!-- ==========================================
       FOOTER
  =========================================== -->

  <footer id="footer"></footer>


  <!-- ==========================================
       JAVASCRIPT
  =========================================== -->

  <script
    src="https://unpkg.com/lucide@latest"
    defer
  ></script>

  <script
    type="module"
    src="../src/main.js"
  ></script>
