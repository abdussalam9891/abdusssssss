<!DOCTYPE html>
<html lang="en">

<head>

  <script>
    if (location.hostname === 'www.banshiwale.com') {
      location.replace('https://banshiwale.com' + location.pathname + location.search + location.hash);
    }
  </script>

  <!-- Meta -->

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Banshiwale | Shopping Cart</title>

  <meta
    name="description"
    content="Review the sterling silver jewellery pieces you've added to your cart at Banshiwale. Update quantities or remove items before checkout."
  />

  <meta
    name="robots"
    content="noindex, follow"
  />

  <meta
    name="theme-color"
    content="#181818"
  />

  <!-- Favicon -->

  <link
    rel="icon"
    href="../favicon.ico"
    sizes="any"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="96x96"
    href="../favicon-96x96.png"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="../favicon-512x512.png"
  />

  <link
    rel="apple-touch-icon"
    href="../apple-touch-icon.png"
  />

  <!-- Fonts -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
  />

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    media="print"
    onload="this.media='all'; this.onload=null;"
  />

  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" /></noscript>

  <link rel="stylesheet" href="../src/features/animations/animations.css" />
  <link rel="stylesheet" href="../src/features/marquee/marquee.css" />
  <link rel="stylesheet" href="../src/features/announcement/announcement.css" />
  <link rel="stylesheet" href="../src/features/products/priceRangeSlider.css" />

  <link
    rel="stylesheet"
    href="../src/css/main.css"
  />

  <link
    rel="stylesheet"
    href="../src/css/tailwind.build.css"
  />
</head>

<body
  class="
    min-h-screen
    bg-white
    font-sans
    text-ink
    antialiased
  "
>

  <!-- Navbar -->

  <div
    id="navbar-container"
    data-theme="dark"
    data-announcement="false"
  ></div>

  <!-- Main -->

  <main>
    <section id="cartPage"></section>
  </main>

  <!-- Footer -->

  <div id="footer"></div>

  <script
    src="https://unpkg.com/lucide@1.40.0"
    defer
  ></script>

  <script
    type="module"
    src="../src/main.js"
  ></script>

</body>

</html>
