<!DOCTYPE html>
<html lang="en">

<head>

  <!-- ==========================================
       DOMAIN REDIRECT
  =========================================== -->

  <script>
    if (location.hostname === 'www.banshiwale.com') {
      location.replace(
        'https://banshiwale.com' +
        location.pathname +
        location.search +
        location.hash
      );
    }
  </script>


  <!-- ==========================================
       BASIC META
  =========================================== -->

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    http-equiv="X-UA-Compatible"
    content="IE=edge"
  />


  <!-- ==========================================
       SEO
  =========================================== -->

  <title>
    Banshiwale | Product Details
  </title>

  <meta
    name="description"
    content="Discover handcrafted sterling silver jewellery from Banshiwale. Explore timeless designs, premium craftsmanship, and jewellery made for every occasion."
  />

  <meta
    name="author"
    content="Banshiwale"
  />

  <meta
    name="robots"
    content="index, follow, max-image-preview:large"
  />

  <!--
    IMPORTANT:
    This page serves multiple products dynamically.

    The actual product-specific canonical URL
    must be injected by JavaScript after the
    product resolves.

    Example:
    https://banshiwale.com/pages/product-details.html?slug=silver-ring

    Do NOT add a fixed canonical pointing to
    products.html for every product.
  -->


  <!-- ==========================================
       OPEN GRAPH
  =========================================== -->

  <meta
    property="og:locale"
    content="en_IN"
  />

  <meta
    property="og:type"
    content="product"
  />

  <meta
    property="og:site_name"
    content="Banshiwale"
  />

  <meta
    property="og:title"
    content="Banshiwale | Silver Jewellery"
  />

  <meta
    property="og:description"
    content="Discover handcrafted sterling silver jewellery from Banshiwale. Explore timeless designs and exceptional craftsmanship."
  />

  <!--
    Product-specific og:url, og:title,
    og:description, and og:image should be
    updated dynamically when the product loads.
  -->

  <meta
    property="og:image"
    content="https://banshiwale.com/src/assets/images/og-image.jpg"
  />

  <meta
    property="og:image:alt"
    content="Banshiwale silver jewellery"
  />

  <meta
    property="og:image:type"
    content="image/jpeg"
  />

  <meta
    property="og:image:width"
    content="1200"
  />

  <meta
    property="og:image:height"
    content="630"
  />


  <!-- ==========================================
       TWITTER / X
  =========================================== -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="Banshiwale | Silver Jewellery"
  />

  <meta
    name="twitter:description"
    content="Discover handcrafted sterling silver jewellery from Banshiwale. Explore timeless designs and exceptional craftsmanship."
  />

  <meta
    name="twitter:image"
    content="https://banshiwale.com/src/assets/images/og-image.jpg"
  />

  <meta
    name="twitter:image:alt"
    content="Banshiwale silver jewellery"
  />


  <!-- ==========================================
       THEME
  =========================================== -->

  <meta
    name="theme-color"
    content="#181818"
  />


  <!-- ==========================================
       FAVICON
  =========================================== -->

  <link
    rel="icon"
    href="../favicon.ico"
    sizes="any"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="96x96"
    href="../favicon-96x96.png"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="../favicon-512x512.png"
  />

  <link
    rel="apple-touch-icon"
    href="../apple-touch-icon.png"
  />


  <!-- ==========================================
       GOOGLE FONTS
  =========================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
  />


  <!-- ==========================================
       CSS
  =========================================== -->

  <link
    rel="stylesheet"
    href="../src/features/animations/animations.css"
  />

  <link
    rel="stylesheet"
    href="../src/features/marquee/marquee.css"
  />

  <link
    rel="stylesheet"
    href="../src/features/announcement/announcement.css"
  />

  <link
    rel="stylesheet"
    href="../src/features/products/priceRangeSlider.css"
  />

  <link
    rel="stylesheet"
    href="../src/css/main.css"
  />


  <!-- ==========================================
       TAILWIND
  =========================================== -->

  <link
    rel="stylesheet"
    href="../src/css/tailwind.build.css"
  />
</head>

<body
  class="
    min-h-screen
    bg-white
    font-sans
    text-ink
    antialiased
  "
>

  <!-- Navbar -->

  <div
    id="navbar-container"
    data-theme="dark"
    data-announcement="false"
  ></div>

  <!-- Main -->

 <main>
  <section id="productDetails"></section>

  <!-- Custom Jewellery -->

  <div id="customizeJewellery"></div>

  <div id="customizeJewelleryDrawer"></div>
</main>

  <!-- Footer -->

  <div id="footer"></div>

  <script
    src="https://unpkg.com/lucide@1.40.0"
    defer
  ></script>

  <script
    type="module"
    src="../src/main.js"
  ></script>

</body>

</html>
