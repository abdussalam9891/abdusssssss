<!DOCTYPE html>
<html lang="en">

<head>

  <script>
    if (location.hostname === 'www.banshiwale.com') {
      location.replace('https://banshiwale.com' + location.pathname + location.search + location.hash);
    }
  </script>

  <!-- Meta -->

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Banshiwale | Collections</title>

  <meta
    name="description"
    content="Explore handcrafted sterling silver jewellery from banshiwale."
  />

  <!--
    Canonicalized to the unfiltered listing URL regardless of any
    ?category=/?occasion=/?sort=/?search=/etc. query string this page
    is loaded with (see src/features/products/query.js) — those
    params drive client-side filtering only, not distinct pages, so
    every filter/sort/search combination should consolidate here
    rather than being indexed as separate duplicate-content URLs.
  -->
  <link
    rel="canonical"
    href="https://banshiwale.com/pages/products.html"
  />

  <!-- ==========================================
       OPEN GRAPH
  =========================================== -->

  <meta
    property="og:title"
    content="Collections | Banshiwale"
  />

  <meta
    property="og:description"
    content="Explore handcrafted sterling silver jewellery from banshiwale."
  />

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:url"
    content="https://banshiwale.com/pages/products.html"
  />

  <meta
    property="og:image"
    content="https://banshiwale.com/src/assets/images/og-image.jpg"
  />

  <!-- ==========================================
       TWITTER
  =========================================== -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="Collections | Banshiwale"
  />

  <meta
    name="twitter:description"
    content="Explore handcrafted sterling silver jewellery from banshiwale."
  />

  <meta
    name="twitter:image"
    content="https://banshiwale.com/src/assets/images/og-image.jpg"
  />

  <meta
    name="theme-color"
    content="#181818"
  />

  <!-- Favicon -->

  <link
    rel="icon"
    href="../favicon.ico"
    sizes="any"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="96x96"
    href="../favicon-96x96.png"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="../favicon-512x512.png"
  />

  <link
    rel="apple-touch-icon"
    href="../apple-touch-icon.png"
  />

  <!-- Fonts -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
  />

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    media="print"
    onload="this.media='all'; this.onload=null;"
  />

  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" /></noscript>

  <link rel="stylesheet" href="../src/features/animations/animations.css" />
  <link rel="stylesheet" href="../src/features/marquee/marquee.css" />
  <link rel="stylesheet" href="../src/features/announcement/announcement.css" />
  <link rel="stylesheet" href="../src/features/products/priceRangeSlider.css" />

  <link
    rel="stylesheet"
    href="../src/css/main.css"
  />

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#A07936",
            background: "#181818",
            surface: "#1C1C1C",
          },

          fontFamily: {
            sans: ["Inter", "sans-serif"],
            serif: ["Cormorant Garamond", "serif"],
          },
        },
      },
    };
  </script>

</head>

<body
  class="
    min-h-screen
    bg-white
    font-sans
    text-[#181818]
    antialiased
  "
>

  <!-- Navbar -->

  <div
    id="navbar-container"
    data-theme="dark"
    data-announcement="true"
  ></div>


  <!-- Main -->

  <main>

    <!-- Hero -->

    <section id="productsHero"></section>


    <!-- Toolbar -->

    <section id="productsToolbar"></section>


    <!-- Products + Filters -->

    <section class="bg-white py-10">

      <div
        class="
          max-w-[1600px]
          mx-auto

          px-4
          sm:px-6
          lg:px-8
          xl:px-10
        "
      >

        <div
          class="
            grid

            grid-cols-1
            lg:grid-cols-[300px_1fr]

            gap-x-12
            gap-y-0
          "
        >

          <!-- Filters -->

          <div id="productsFiltersContainer"></div>


          <!-- Products -->

          <div>

            <!-- Product Grid -->

            <div id="productsGrid"></div>


            <!-- Backend Pagination -->

            <div
              id="productsPagination"
              class="mt-12"
            ></div>

          </div>

        </div>

      </div>

    </section>


    <!-- Recently Viewed -->

    <section id="recentlyViewed"></section>

    <!-- Custom Jewellery -->

    <div id="customizeJewellery"></div>

    <div id="customizeJewelleryDrawer"></div>

  </main>


  <!-- Footer -->

  <div id="footer"></div>


  <!-- Lucide -->

  <script
    src="https://unpkg.com/lucide@1.40.0"
    defer
  ></script>


  <!-- Main JS -->

  <script
    type="module"
    src="../src/main.js"
  ></script>

</body>

</html>
