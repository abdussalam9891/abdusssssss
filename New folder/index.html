 <link rel="stylesheet" href="./src/css/main.css" />

<div

 <div

></div>

<section class="bg-white py-8 lg:py-14">

      <p

<section id="showcase"></section>






<!-- Lifestyle Video Section -->

<section

        muted
        loop
        preload="none"

        <source src="./src/assets/v-1.mp4" type="video/mp4" />
      </video>

      <!-- OVERLAY -->
      <div
        class="absolute inset-0 bg-gradient-to-t from-black/50 via-black/20 to-transparent"
      ></div>

      <!-- CONTENT -->
      <div
        class="relative z-10 h-full flex items-center justify-center text-center px-6"
      >
        <div class="max-w-xl">
          <!-- Label -->

         <a

    group

    inline-flex
    items-center
    justify-center

    overflow-hidden

    px-6
    py-3

    text-white
  "
>

      group-hover:scale-x-100

  ></span>

  <!-- Button Text -->
  <span
    class="
      relative
      z-10

      transition-colors
      duration-300

      group-hover:text-black

</a>
        </div>
      </div>

<!-- craftmanship  -->
